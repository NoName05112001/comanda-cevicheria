name: Build Puente (.exe)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'puente/**'
      - '.github/workflows/build-puente.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: puente
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone .exe
        # --collect-all para firebase_admin/grpc/google-cloud-firestore: estos
        # paquetes cargan algunos módulos de forma dinámica y PyInstaller no
        # siempre los detecta solo; sin esto el .exe puede arrancar y fallar
        # recién al intentar conectar con Firestore.
        run: >-
          pyinstaller --onefile --console --name puente-comanda-cevicheria
          --collect-all firebase_admin
          --collect-all google.cloud.firestore
          --collect-all grpc
          --collect-all google.api_core
          bridge_server.py

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: puente-comanda-cevicheria-exe
          path: puente/dist/puente-comanda-cevicheria.exe

      - name: Build .exe de inspección (solo lectura, para mapear "999")
        run: pyinstaller --onefile --console --name inspeccionar-ventana inspeccionar_ventana.py

      - name: Upload .exe de inspección
        uses: actions/upload-artifact@v4
        with:
          name: inspeccionar-ventana-exe
          path: puente/dist/inspeccionar-ventana.exe
