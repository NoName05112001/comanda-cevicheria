name: Publicar sitio (GitHub Pages)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}
  

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir carpeta www/ como contenido del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
