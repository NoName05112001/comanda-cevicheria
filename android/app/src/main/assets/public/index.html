<title>Comanda Cevichería</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5D52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comanda">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EFF6F3;
  --surface:#FFFFFF;
  --surface-2:#E4EFE9;
  --border:#D3E2DA;
  --text:#12211D;
  --text-muted:#5C6E66;
  --accent:#E0602A;
  --accent-ink:#FFFFFF;
  --teal:#0B5D52;
  --teal-ink:#FFFFFF;
  --success:#1F9D6B;
  --success-bg:#E3F5EC;
  --warning:#C9891C;
  --warning-bg:#FBF0DC;
  --danger:#C4392C;
  --danger-bg:#FBE6E2;
  --shadow: 0 1px 2px rgba(18,33,29,.06), 0 6px 18px -8px rgba(18,33,29,.18);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613;
    --surface:#16211D;
    --surface-2:#1C2924;
    --border:#2A3A33;
    --text:#ECF3EF;
    --text-muted:#9BB2A6;
    --accent:#FF8355;
    --accent-ink:#1A1006;
    --teal:#3FB6A3;
    --teal-ink:#08211C;
    --success:#3FC088;
    --success-bg:#123024;
    --warning:#E3AE4E;
    --warning-bg:#332608;
    --danger:#F0796A;
    --danger-bg:#331413;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613;
  --surface:#16211D;
  --surface-2:#1C2924;
  --border:#2A3A33;
  --text:#ECF3EF;
  --text-muted:#9BB2A6;
  --accent:#FF8355;
  --accent-ink:#1A1006;
  --teal:#3FB6A3;
  --teal-ink:#08211C;
  --success:#3FC088;
  --success-bg:#123024;
  --warning:#E3AE4E;
  --warning-bg:#332608;
  --danger:#F0796A;
  --danger-bg:#331413;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.font-display{font-family:'Sora',system-ui,sans-serif;text-wrap:balance;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative;}
.hidden{display:none!important;}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:20;
  background:var(--teal);color:var(--teal-ink);
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
}
.appbar .titles{flex:1;min-width:0;}
.appbar h1{margin:0;font-size:19px;font-weight:700;line-height:1.2;}
.appbar .sub{font-size:12.5px;opacity:.78;margin-top:1px;}
.iconbtn{
  position:relative;
  border:none;background:rgba(255,255,255,.14);color:inherit;
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;flex-shrink:0;
}
.iconbtn:active{background:rgba(255,255,255,.26);}
.iconbtn .count{
  position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;
  background:var(--danger);color:#fff;border-radius:999px;
  font-size:10px;font-weight:800;font-family:'Sora',sans-serif;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.pillbtn{
  border:none;background:rgba(255,255,255,.14);color:inherit;
  padding:0 14px;height:36px;border-radius:999px;font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;white-space:nowrap;
}
.pillbtn.on{background:var(--accent);color:var(--accent-ink);}
.appbar-actions{display:flex;gap:8px;flex-shrink:0;}

/* ---------- Layout helpers ---------- */
.page-body{padding:14px 16px 20px;}
.section-title{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:18px 2px 10px;}
.section-title:first-child{margin-top:2px;}

/* ---------- Chips row (ambientes) ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  padding:0 16px;height:40px;border-radius:999px;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
.chip.dashed{border-style:dashed;color:var(--text-muted);font-weight:600;}
.chip .mini{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.08);font-size:12px;cursor:pointer;}
.chip.active .mini{background:rgba(255,255,255,.22);}

/* ---------- Grids ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);}}
.grid.cats{grid-template-columns:repeat(2,1fr);}
/* Celular en horizontal: hay más ancho disponible, así que se aprovecha con más
   columnas en vez de dejarlo centrado y angosto como en vertical. */
@media (orientation:landscape) and (min-width:600px){
  #app{max-width:920px;}
  .grid{grid-template-columns:repeat(4,1fr);}
  .grid.cats{grid-template-columns:repeat(3,1fr);}
}
@media (orientation:landscape) and (min-width:900px){
  .grid{grid-template-columns:repeat(5,1fr);}
  .grid.cats{grid-template-columns:repeat(4,1fr);}
}

.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 10px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:96px;position:relative;
}
.tile .num{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;}
.tile .status-dot{width:9px;height:9px;border-radius:999px;position:absolute;top:12px;right:12px;}
.tile .status-label{font-size:11.5px;font-weight:700;color:var(--text-muted);}
.tile .total{font-size:13px;font-weight:700;margin-top:auto;}
.tile.libre{}
.tile.abierto{border-color:var(--accent);}
.tile.cerrado{border-color:var(--warning);}
.tile.atendida{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal), var(--shadow);}
.tile.atendida .status-label{color:var(--teal);}
.tile.dashed{border-style:dashed;align-items:center;justify-content:center;color:var(--text-muted);font-weight:700;box-shadow:none;background:transparent;}
.tile .editrow{display:flex;gap:6px;margin-top:auto;position:absolute;bottom:10px;right:10px;}
.tile .editbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}

.tile.pendiente{padding-right:38px;}
.tile.pendiente .pmesa{font-family:'Sora',sans-serif;font-size:19px;font-weight:800;color:var(--accent);}
.tile.pendiente .pdish{font-size:12.5px;font-weight:700;line-height:1.35;}
.tile.pendiente .pdetalle{font-size:11px;color:var(--text-muted);line-height:1.3;}
.tile.pendiente .pdone{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-muted);}

/* ---------- Plano de mesas (distribución real tipo 999) ---------- */
.planwrap{overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 8px;}
.plan{position:relative;}
.plantile{
  position:absolute;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:12.5px;line-height:1.1;
  cursor:pointer;box-shadow:var(--shadow);overflow:hidden;padding:2px;
}
.plantile .num{white-space:nowrap;}
.plantile.libre{background:var(--success-bg);border-color:var(--success);}
.plantile.abierto{background:#FCE7DC;border-color:var(--accent);}
.plantile.cerrado{background:var(--warning-bg);border-color:var(--warning);}
.plantile.atendida{background:var(--success-bg);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal);}
.planlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);padding:10px 2px 2px;}
.planlegend span{display:flex;align-items:center;gap:6px;}
.planlegend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid var(--border);}

.catcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;
}
.catcard .badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Sora',sans-serif;font-size:14px;flex-shrink:0;}
.catcard .name{font-weight:700;font-size:14.5px;line-height:1.25;}

/* ---------- Empty state ---------- */
.empty{
  border:1.5px dashed var(--border);border-radius:var(--radius-lg);
  padding:28px 20px;text-align:center;color:var(--text-muted);
}
.empty .icon{font-size:30px;margin-bottom:6px;}
.empty h3{margin:4px 0 4px;color:var(--text);font-size:16px;}
.empty p{margin:0 0 14px;font-size:13.5px;line-height:1.5;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;
  padding:0 18px;height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn.primary{background:var(--accent);color:var(--accent-ink);}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn.teal{background:var(--teal);color:var(--teal-ink);}
.btn.danger{background:var(--danger-bg);color:var(--danger);}
.btn.ghost{background:transparent;color:var(--text-muted);height:40px;padding:0 8px;}
.btn.block{width:100%;}
.btn.sm{height:38px;font-size:13.5px;padding:0 14px;}
.btn:disabled{opacity:.5;cursor:default;}

/* ---------- Mesa screen ---------- */
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;}
.status-pill.libre{background:var(--success-bg);color:var(--success);}
.status-pill.abierto{background:#FCE7DC;color:var(--accent);}
.status-pill.cerrado{background:var(--warning-bg);color:var(--warning);}
.status-pill.atendida{background:var(--success-bg);color:var(--teal);}
.status-pill .dot{width:7px;height:7px;border-radius:999px;background:currentColor;}

.itemcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.itemcard .row1{display:flex;justify-content:space-between;gap:10px;}
.itemcard .name{font-weight:700;font-size:14.5px;}
.itemcard .price{font-weight:700;font-size:14.5px;white-space:nowrap;}
.itemcard .detalle{font-size:12.5px;color:var(--text-muted);margin-top:4px;line-height:1.4;}
.itemcard .row2{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.qtystepper{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
.qtystepper button{width:34px;height:34px;border:none;background:var(--surface-2);font-size:16px;font-weight:700;cursor:pointer;color:var(--text);}
.qtystepper .n{width:30px;text-align:center;font-weight:700;font-size:14.5px;}
.itemcard .iconbtn.small{width:34px;height:34px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.itemcard .iconbtn.small:active{color:var(--danger);}
.itemcard.served{border-color:var(--success);}
.itemcard.served .name{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--border);}
.servedpill{border:none;background:var(--warning-bg);color:var(--warning);font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px;}
.servedpill.done{background:var(--success-bg);color:var(--success);}
.servedcount{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:2px;}
.servedcount.complete{color:var(--success);}
.edit-link{background:none;border:none;color:var(--teal);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;}

.totalbar{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 22px -12px rgba(18,33,29,.28);
}
.totalbar-inner{max-width:640px;margin:0 auto;}
.totalbar .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.totalbar .tot-label{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.totalbar .tot-value{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;}
.totalbar .btnrow{display:flex;gap:8px;}
.totalbar .btnrow .btn{flex:1;}

/* ---------- Modal / bottom sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.overlay.center{align-items:center;padding:20px;}
.sheet{
  background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
  animation:sheetup .18s ease-out;
}
@keyframes sheetup{from{transform:translateY(16px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:999px;margin:10px auto 0;}
.sheet-header{padding:10px 18px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.sheet-header h2{margin:0;font-size:18px;}
.sheet-header .desc{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.4;}
.sheet-body{padding:6px 18px 18px;}
.sheet-footer{position:sticky;bottom:0;background:var(--bg);padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;}
.sheet-footer .btn{flex:1;}

.dialog{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:360px;padding:20px;box-shadow:var(--shadow);}
.dialog h3{margin:0 0 8px;font-size:16.5px;}
.dialog p{margin:0 0 18px;font-size:13.5px;color:var(--text-muted);line-height:1.5;}
.dialog .btnrow{display:flex;gap:10px;}
.dialog .btnrow .btn{flex:1;}

/* ---------- Form fields ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:12px;padding:12px 13px;font-size:15px;
}
.field textarea{min-height:64px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.checkrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.checkrow input{width:20px;height:20px;}
.checkrow label{font-size:14px;font-weight:600;}

.chipselect{display:flex;flex-wrap:wrap;gap:8px;}
.optchip{
  border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.optchip.sel{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);}
.optchip.obs.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

.pref-group{margin-bottom:16px;}
.pref-group .glabel{font-weight:700;font-size:13.5px;margin-bottom:8px;}

.prefrow{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface);}
.prefrow .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prefrow .top span{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0;}
.linkbtn.danger{color:var(--danger);}

.stepper-lg{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 4px;}
.stepper-lg button{width:44px;height:44px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;}
.stepper-lg .n{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;min-width:44px;text-align:center;}

/* ---------- Carta admin ---------- */
.catsection{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.catsection .chead{padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.catsection .chead .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-muted);background:var(--surface-2);padding:2px 9px;border-radius:999px;}
.catsection .cbody{padding:0 14px 14px;}
.prodrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
.prodrow .info{flex:1;min-width:0;}
.prodrow .pname{font-weight:700;font-size:14px;}
.prodrow .pdesc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.prodrow .pprice{font-size:12.5px;color:var(--text-muted);margin-top:3px;font-weight:600;}
.prodrow .actions{display:flex;gap:6px;flex-shrink:0;align-self:flex-start;}

/* ---------- Product list (ordering) ---------- */
.prodcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;}
.prodcard .pinfo{flex:1;min-width:0;cursor:pointer;}
.prodcard .name{font-weight:700;font-size:15px;}
.prodcard .desc{font-size:12.5px;color:var(--text-muted);margin-top:4px;line-height:1.45;}
.prodcard .prices{display:flex;gap:14px;margin-top:9px;}
.prodcard .price{font-size:13.5px;font-weight:700;color:var(--teal);}
.prodcard .price .lbl{font-weight:600;color:var(--text-muted);font-size:11px;text-transform:uppercase;display:block;}
.prodcard .qaddbtn{flex-shrink:0;width:46px;height:46px;border-radius:13px;background:var(--teal);color:#fff;border:none;font-family:'Sora',sans-serif;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;padding:0;}
.prodcard .qaddbtn:active{opacity:.8;}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:88vw;text-align:center;}

.loadingnote{font-size:12px;color:var(--text-muted);padding:0 16px 8px;}
</style>

<div id="app"></div>
<div id="modal-layer"></div>
<div id="toast-layer"></div>

<script>
(function(){
"use strict";

/* ============================== DATA ============================== */

var CATEGORIAS = [
  {id:"ceviches", n:"Ceviches"},
  {id:"ceviches-especiales", n:"Ceviches Especiales"},
  {id:"nuevos-platos", n:"Nuevos Platos"},
  {id:"ceviches-mariscos", n:"Ceviches de Mariscos"},
  {id:"chicharrones", n:"Chicharrones"},
  {id:"chicharrones-especiales", n:"Chicharrones Especiales"},
  {id:"sudados", n:"Sudados"},
  {id:"arroces", n:"Arroces"},
  {id:"chaufas", n:"Chaufas"},
  {id:"picantes", n:"Picantes"},

/* Botón físico/gesto "Atrás" de Android: se conecta con el plugin nativo
   App de Capacitor (más confiable que la API de historial del navegador
   dentro de un WebView). Cierra primero lo que esté abierto encima
   (confirmación, luego modal), después navega de pantalla hacia atrás,
   y solo cierra la app si ya estamos en el inicio. */
function handleHardwareBack(){
  if(S.confirm){ closeConfirm(); return; }
  if(S.modal){ closeModal(); return; }
  if(S.stack.length>1){ goBack(); return; }
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
      window.Capacitor.Plugins.App.exitApp();
    }
  }catch(e){}
}
(function registerHardwareBack(){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App){
      window.Capacitor.Plugins.App.addListener("backButton", handleHardwareBack);
    }
  }catch(e){}
})();

/* ============================== STORE (db capability + local fallback) ============================== */

var DB = null;

function createLocalStore(){
  var LS_KEY = "comanda_local_store_v1";
  var collections = {};
  var listeners = {};
  function ensure(name){
    if(!collections[name]) collections[name] = {};
    if(!listeners[name]) listeners[name] = [];
    return collections[name];
  }
  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(collections)); }catch(e){}
  }
  function hydrate(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw) collections = JSON.parse(raw);
    }catch(e){}
  }
  hydrate();
  /* First run only: seed the on-device menu from the embedded catalog. */
  (function seedIfEmpty(){
    var existing = ensure("productos");
    if(Object.keys(existing).length>0) return;
    if(!SEED_PRODUCTOS || !SEED_PRODUCTOS.length) return;
    SEED_PRODUCTOS.forEach(function(p){
      var copy = {};
      for(var k in p){ if(k!=="id") copy[k]=p[k]; }
      existing[p.id] = copy;
    });
    persist();
  })();
  function snapshotDocs(name){
    var map = ensure(name);
    return Object.keys(map).map(function(id){
      var data = map[id];
      return {id:id, exists:true, data:function(){ return data; }};
    });
  }
  function notify(name){
    persist();
    var docs = snapshotDocs(name);
    var snap = {docs:docs, size:docs.length, empty:docs.length===0};
    (listeners[name]||[]).forEach(function(fn){ fn(snap); });
  }
  function makeDocRef(name, id){
    return {
      id:id,
      get:function(){
        var map=ensure(name);
        var d=map[id];
        return Promise.resolve({id:id, exists: d!==undefined, data:function(){return d;}});
      },
      set:function(data){
        var map=ensure(name);
        map[id]=JSON.parse(JSON.stringify(data));
        notify(name);
        return Promise.resolve();
      },
      update:function(data){
        var map=ensure(name);
        var cur=map[id]||{};
        map[id]=Object.assign({}, cur, JSON.parse(JSON.stringify(data)));
        notify(name);
        return Promise.resolve();
      },
      delete:function(){
        var map=ensure(name);
        delete map[id];
        notify(name);
        return Promise.resolve();
      }
    };
  }
  var counter=0;
  function collection(name){
    return {
      doc:function(id){
        var docId = id || ("local_"+Date.now().toString(36)+"_"+(counter++));
        return makeDocRef(name, docId);
      },
      add:function(data){
        var ref = this.doc();
        return ref.set(data).then(function(){ return ref; });
      },
      onSnapshot:function(next){
        listeners[name] = listeners[name]||[];
        listeners[name].push(next);
        var docs = snapshotDocs(name);
        next({docs:docs, size:docs.length, empty:docs.length===0});
        return function(){
          listeners[name] = (listeners[name]||[]).filter(function(f){return f!==next;});
        };
      }
    };
  }
  return {collection:collection};
}

function initStore(){
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(ns){
      if(ns){
        DB = ns;
        S.dbMode = "cloud";
      } else {
        DB = createLocalStore();
        S.dbMode = "local";
      }
      subscribeAll();
    }).catch(function(){
      DB = createLocalStore();
      S.dbMode = "local";
      subscribeAll();
    });
  } else {
    DB = createLocalStore();
    S.dbMode = "local";
    subscribeAll();
  }
}

function subscribeAll(){
  subscribeCollection("ambientes","ambientes");
  subscribeCollection("mesas","mesas");
  subscribeCollection("productos","productos");
  subscribeCollection("pedidos","pedidos");
}
function subscribeCollection(name, key){
  DB.collection(name).onSnapshot(function(snap){
    S[key] = snap.docs.filter(function(d){return d.exists;}).map(function(d){
      var data = d.data()||{};
      var o = {id:d.id};
      for(var k in data) o[k]=data[k];
      return o;
    });
    S.ready = true;
    if(key==="pedidos"){ purgeHistorialViejo(); purgeMesasLiberadas(); }
    if(key==="mesas") purgeMesasLiberadas();
    render();
  }, function(err){
    console.error("db error", name, err);
  });
}

/* ---------- Búsqueda de platos (por palabras acortadas, ej. "cev sim", tolerante a errores de tecleo) ---------- */
function quitarAcentos(str){
  try{ return String(str||"").normalize("NFD").replace(/[̀-ͯ]/g,""); }
  catch(e){ return String(str||""); }
}
function normalizarTexto(str){ return quitarAcentos(str).toLowerCase(); }

/* Mapa de teclas vecinas en un teclado QWERTY normal: una letra tocada por error
   junto a la que se quería escribir cuenta como un error "barato" (0.5) en vez
   de un error normal (1), para que esos casos sigan encontrando el plato. */
var QWERTY_VECINAS = {
  q:"wa", w:"qeas", e:"wrsd", r:"etdf", t:"ryfg", y:"tugh", u:"yihj", i:"uojk", o:"ipkl", p:"ol",
  a:"qwsz", s:"awedzxc", d:"serfxcv", f:"drtgcvb", g:"ftyhvbn", h:"gyujbnm", j:"huiknm", k:"jiolm", l:"kop",
  z:"asx", x:"zsdc", c:"xdfv", v:"cfgb", b:"vghn", n:"bhjm", m:"njk"
};
function sonVecinas(c1, c2){
  if(c1===c2) return true;
  var v = QWERTY_VECINAS[c1];
  return !!v && v.indexOf(c2)>=0;
}
/* Distancia de edición (tipo Levenshtein) entre dos textos cortos, con costo reducido
   cuando la letra cambiada está al lado de la correcta en el teclado. */
function distanciaDifusa(a, b){
  var m=a.length, n=b.length;
  var dp = [];
  var i, j;
  for(i=0;i<=m;i++){ dp.push(new Array(n+1)); dp[i][0]=i; }
  for(j=0;j<=n;j++) dp[0][j]=j;
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      var ca=a[i-1], cb=b[j-1];
      var costoSub = ca===cb ? 0 : (sonVecinas(ca,cb) ? 0.5 : 1);
      dp[i][j] = Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+costoSub
      );
    }
  }
  return dp[m][n];
}
/* ¿El pedacito "tok" que escribió el mozo se parece lo suficiente al inicio de "palabra"?
   Primero intenta el match exacto de siempre (rápido). Si no calza, para lo corto (3-4
   letras) solo se compara letra por letra contra el inicio de la palabra del mismo largo
   (evita que un pedacito corto "encuentre" cualquier cosa por casualidad); para lo más
   largo se admite además una letra de más o de menos, con más margen de error. */
function tokenCoincidePalabra(tok, palabra){
  if(tok.length===0) return true;
  if(palabra.indexOf(tok)===0) return true;
  if(tok.length<3) return false;
  if(tok.length<=4){
    if(palabra.length<tok.length) return false;
    var ventana = palabra.slice(0,tok.length);
    var costo = 0;
    for(var k=0;k<tok.length;k++){
      if(tok[k]!==ventana[k]) costo += sonVecinas(tok[k],ventana[k]) ? 0.5 : 1;
    }
    return costo<=1;
  }
  var tolerancia = tok.length<=7 ? 1 : (tok.length<=11 ? 1.5 : 2);
  var minLen = Math.max(1, tok.length-1);
  var maxLen = Math.min(palabra.length, tok.length+1);
  for(var len=minLen; len<=maxLen; len++){
    if(distanciaDifusa(tok, palabra.slice(0,len)) <= tolerancia) return true;
  }
  return false;
}
function productoCoincideBusqueda(producto, query){
  var tokens = normalizarTexto(query).split(/\s+/).filter(Boolean);
  if(tokens.length===0) return true;
  var palabras = normalizarTexto(producto.nombre||"").split(/\s+/).filter(Boolean);
  return tokens.every(function(tok){
    return palabras.some(function(w){ return tokenCoincidePalabra(tok, w); });
  });
}
/* Qué tan "directo" es el calce entre lo escrito y el nombre del plato: entre dos
   platos que contienen las mismas palabras buscadas, debe ganar el que tiene MENOS
   palabras de más (ej. buscar "cev simp" debe mostrar primero "Ceviche Simple" y
   recién después "Ceviche Especial Simple de Corvina", que trae palabras extra) y,
   si hay empate, el que tiene las palabras buscadas más al inicio del nombre.
   Devuelve un puntaje donde MENOS es más relevante. */
function relevanciaBusqueda(producto, tokens){
  var palabras = normalizarTexto(producto.nombre||"").split(/\s+/).filter(Boolean);
  var palabrasExtra = Math.max(0, palabras.length - tokens.length);
  var sumaPosiciones = 0;
  var sinCalceExacto = 0;
  tokens.forEach(function(tok){
    var pos = -1, exacto = false;
    for(var i=0;i<palabras.length;i++){
      if(palabras[i].indexOf(tok)===0){ pos=i; exacto=true; break; }
    }
    if(pos===-1){
      for(var j=0;j<palabras.length;j++){
        if(tokenCoincidePalabra(tok, palabras[j])){ pos=j; break; }
      }
    }
    if(pos===-1) pos = palabras.length;
    sumaPosiciones += pos;
    if(!exacto) sinCalceExacto++;
  });
  return palabrasExtra*10 + sumaPosiciones*2 + sinCalceExacto;
}
/* Personal antes que Fuente cuando el nombre del plato termina en una de esas dos
   palabras (así quedó la carta tras separar tamaños en platos aparte). */
function rangoPresentacion(nombre){
  var palabras = normalizarTexto(nombre||"").split(/\s+/).filter(Boolean);
  var ultima = palabras[palabras.length-1];
  if(ultima==="personal") return 0;
  if(ultima==="fuente") return 1;
  return 2;
}
/* Varios platos (ceviches, sudados, chicharrones...) tienen versión "Simple" y también
   "Clásico"/"Mixto"/etc. Cuando lo que escribió el mozo no dice cuál de las dos es (ej.
   solo "cev" o "sudado corvina", sin decir "simple" ni "clásico"), el que casi siempre
   piden es el Simple: debe salir primero en vez de depender del orden alfabético o de
   cuántas veces se pidió antes (que en una carta nueva empieza en cero para todos). */
function rangoVariante(nombre){
  var palabras = normalizarTexto(nombre||"").split(/\s+/).filter(Boolean);
  return palabras.indexOf("simple")>=0 ? 0 : 1;
}
function buscarProductos(query){
  var tokens = normalizarTexto(query).split(/\s+/).filter(Boolean);
  return S.productos.filter(function(p){ return productoCoincideBusqueda(p, query); })
    .sort(function(a,b){
      if(tokens.length>0){
        var ra = relevanciaBusqueda(a, tokens), rb = relevanciaBusqueda(b, tokens);
        if(ra!==rb) return ra-rb;
      }
      var sa = rangoVariante(a.nombre), sb = rangoVariante(b.nombre);
      if(sa!==sb) return sa-sb;
      var pa = rangoPresentacion(a.nombre), pb = rangoPresentacion(b.nombre);
      if(pa!==pb) return pa-pb;
      var va = a.vecesPedido||0, vb = b.vecesPedido||0;
      if(va!==vb) return vb-va;
      return (a.nombre||"").localeCompare(b.nombre||"");
    });
}

/* ---------- Pedido por texto (pegar varias líneas, un plato por línea, y separarlas solas) ---------- */
function buscarProductoPorNombreExacto(nombre){
  var norm = normalizarTexto(nombre);
  return S.productos.filter(function(p){ return normalizarTexto(p.nombre||"")===norm; })[0] || null;
}
/* Los tamaños de gaseosa/bebida ("litro y medio", "medio litro", "mediana"...) se resuelven
   directo por nombre exacto en vez de por los tokens normales: como el nombre del producto
   trae números ("Gaseosa 1 1/2 Litro"), el token "1" calzaría también como prefijo de "1/2"
   y podría confundir "1 1/2 Litro" con "1/2 Litro". Así se evita ese cruce. */
var TAMANO_GASEOSA_DIRECTO = [
  {re:/\blitro\s+y\s+\w{3,7}\b/, nombre:"Gaseosa 1 1/2 Litro"},
  {re:/\b1[.,]?5\s*l(itros?)?\b/, nombre:"Gaseosa 1 1/2 Litro"},
  {re:/\bmedio\s+litro\b/, nombre:"Gaseosa 1/2 Litro"},
  {re:/\bun\s+litro\b/, nombre:"Gaseosa 1 Litro"},
  {re:/\b1\s*l(itro)?\b/, nombre:"Gaseosa 1 Litro"},
  {re:/\bmediana\b/, nombre:"Gaseosa Mediana"},
  {re:/\bjumbo\b|\bgordita\b/, nombre:"Gordita o Jumbo"}
];
function detectarGaseosaDirecta(w){
  for(var i=0;i<TAMANO_GASEOSA_DIRECTO.length;i++){
    var t = TAMANO_GASEOSA_DIRECTO[i];
    if(t.re.test(w)){
      var prod = buscarProductoPorNombreExacto(t.nombre);
      if(prod) return {producto:prod, restante: w.replace(t.re," ")};
    }
  }
  return null;
}
/* Cuando piden un plato para llevar (o solo el táper, sin plato) suelen escribir
   el tamaño igual que en las gaseosas ("medio litro", "un litro"...). Si la línea
   menciona "táper" se resuelve aparte y ANTES que detectarGaseosaDirecta, para que
   "táper medio litro" no termine cayendo como Gaseosa 1/2 Litro solo porque esa
   frase de tamaño también aparece ahí. */
var TAPER_KEYWORD_RE = /\btapers?\b/;
var TAMANO_TAPER_DIRECTO = [
  {re:/\bmedio\s+litro\b/, nombre:"Táper 1/2 Litro"},
  {re:/\b1\/2\s*l(itros?)?\b/, nombre:"Táper 1/2 Litro"},
  {re:/\bun\s+litro\b/, nombre:"Táper 1 Litro"},
  {re:/\b1\s*l(itro)?\b/, nombre:"Táper 1 Litro"},
  {re:/\blitro\b/, nombre:"Táper 1 Litro"}
];
function detectarTaperDirecto(w){
  if(!TAPER_KEYWORD_RE.test(w)) return null;
  for(var i=0;i<TAMANO_TAPER_DIRECTO.length;i++){
    var t = TAMANO_TAPER_DIRECTO[i];
    if(t.re.test(w)){
      var prod = buscarProductoPorNombreExacto(t.nombre);
      if(prod) return {producto:prod, restante: w.replace(TAPER_KEYWORD_RE," ").replace(t.re," ")};
    }
  }
  /* Se menciona "táper" pero sin tamaño (ej. solo "2 táper"): por defecto el de 1 litro. */
  var prod1 = buscarProductoPorNombreExacto("Táper 1 Litro");
  if(prod1) return {producto:prod1, restante: w.replace(TAPER_KEYWORD_RE," ")};
  return null;
}
var GASEOSA_MARCA_CC_RE = /\b(coca[\s-]?cola|cocacola|coca|cc)\b/;
var GASEOSA_MARCA_IK_RE = /\b(inca[\s-]?kola|incakola|inca|ik)\b/;
var TEMP_HELADA_RE = /\b(helada|helado|fria|h)\b/;
var TEMP_SINHELAR_RE = /\b(sin\s*helar|al\s*tiempo|natural|sh)\b/;
/* Igual que buscarProductos, pero si el texto completo no encuentra nada prueba con
   un prefijo más corto (quitando la última palabra), para que una nota o abreviatura
   suelta al final de la línea ("Sh", "Cg"...) no bloquee el calce del plato. Lo que
   sobra de más queda como texto suelto para el detalle. */
function tokenEsPrefijoExactoDeNombre(tok, nombre){
  var palabras = normalizarTexto(nombre||"").split(/\s+/).filter(Boolean);
  return palabras.some(function(w){ return w.indexOf(tok)===0; });
}
function mejorProductoParaTokens(tokens){
  for(var len=tokens.length; len>=1; len--){
    var q = tokens.slice(0,len).join(" ");
    var res = buscarProductos(q);
    if(len===1 && res.length>0){
      /* Para una sola palabra suelta (lo que queda tras sacar cantidad, marca, temperatura
         y notas entre paréntesis) no usamos la tolerancia a errores de tipeo de la búsqueda
         normal: una palabra que por casualidad "se parece" a otro plato (ej. "zero" se
         parece a "arroz" por el teclado) no debe colarse sola como un plato distinto sin que
         nadie la revise. Solo aceptamos que sea el inicio real de alguna palabra del nombre. */
      res = res.filter(function(p){ return tokenEsPrefijoExactoDeNombre(tokens[0], p.nombre); });
    }
    if(res.length>0) return {producto:res[0], sobran:tokens.slice(len)};
  }
  return null;
}
function parsearLineaPedido(lineaOriginal){
  var linea = String(lineaOriginal||"").trim();
  if(!linea) return null;
  var cantidad = 1;
  var mCant = linea.match(/^(\d{1,2})\s+(.+)$/);
  if(mCant && !/^(litro|lt)\b/i.test(mCant[2])){
    cantidad = parseInt(mCant[1],10)||1;
    linea = mCant[2];
  }
  var detallesParentesis = [];
  linea = linea.replace(/\(([^)]+)\)/g, function(_, inner){
    detallesParentesis.push(inner.trim());
    return " ";
  });
  var w = normalizarTexto(linea);
  var producto = null, sobranteExtra = "";
  var directoTaper = detectarTaperDirecto(w);
  if(directoTaper){
    producto = directoTaper.producto; w = directoTaper.restante;
  } else {
    var directo = detectarGaseosaDirecta(w);
    if(directo){ producto = directo.producto; w = directo.restante; }
  }
  var marca = null, temperatura = null;
  if(GASEOSA_MARCA_CC_RE.test(w)){ marca="Coca-Cola"; w = w.replace(GASEOSA_MARCA_CC_RE," "); }
  else if(GASEOSA_MARCA_IK_RE.test(w)){ marca="Inca Kola"; w = w.replace(GASEOSA_MARCA_IK_RE," "); }
  if(TEMP_HELADA_RE.test(w)){ temperatura="Helada"; w = w.replace(TEMP_HELADA_RE," "); }
  else if(TEMP_SINHELAR_RE.test(w)){ temperatura="Sin helar"; w = w.replace(TEMP_SINHELAR_RE," "); }
  if(!producto){
    var tokens = w.split(/\s+/).filter(Boolean);
    if(tokens.length>0){
      var match = mejorProductoParaTokens(tokens);
      if(match){ producto = match.producto; sobranteExtra = match.sobran.join(" ").trim(); }
    }
  } else {
    sobranteExtra = w.trim();
  }
  var detalleFinal = detallesParentesis.slice();
  if(sobranteExtra) detalleFinal.push(sobranteExtra);
  return {
    raw: lineaOriginal,
    cantidad: cantidad,
    producto: producto,
    detalle: detalleFinal.join(", "),
    prefsAuto: {marca:marca, temperatura:temperatura}
  };
}
function parsearPedidoTexto(texto){
  return String(texto||"").split("\n").map(parsearLineaPedido).filter(Boolean);
}
function agregarPedidoTexto(mesaId, draftItems){
  var validos = draftItems.filter(function(d){ return d.producto; });
  if(validos.length===0) return Promise.resolve();
  var nuevosItems = validos.map(function(d){
    var producto = d.producto;
    var prefs = defaultPrefs(producto);
    (producto.preferencias||[]).forEach(function(g){
      var esMarca = /marca/i.test(g.nombre||"");
      var esTemp = /temperatura/i.test(g.nombre||"");
      if(esMarca && d.prefsAuto.marca && (g.opciones||[]).indexOf(d.prefsAuto.marca)>=0) prefs[g.id]=d.prefsAuto.marca;
      if(esTemp && d.prefsAuto.temperatura && (g.opciones||[]).indexOf(d.prefsAuto.temperatura)>=0) prefs[g.id]=d.prefsAuto.temperatura;
    });
    var draftObj = {prefs:prefs, obsChips:[], obsTexto:d.detalle||""};
    var precioUnit = producto.precioPersonal;
    return {
      id: uid("item"),
      productoId: producto.id,
      categoriaId: producto.categoriaId,
      nombre: producto.nombre,
      cantidad: d.cantidad||1,
      presentacion: producto.precioFuente ? "Personal" : null,
      precioUnit: precioUnit,
      subtotal: precioUnit*(d.cantidad||1),
      prefs: prefs,
      obsChips: [],
      obsTexto: d.detalle||"",
      detalle: buildDetalle(producto, draftObj),
      servido: false
    };
  });
  return ensurePedido(mesaId).then(function(pedido){
    var items = (pedido.items||[]).concat(nuevosItems);
    var total = itemsTotal(items);
    validos.forEach(function(d){
      DB.collection("productos").doc(d.producto.id).update({vecesPedido: (d.producto.vecesPedido||0) + (d.cantidad||1)});
    });
    return DB.collection("pedidos").doc(pedido.id).update({items:items, total:total, actualizadoEn:new Date().toISOString()});
  });
}

function getPedido(id){ return S.pedidos.filter(function(p){return p.id===id;})[0]; }
function activePedidoForMesa(mesaId){
  var list = S.pedidos.filter(function(p){return p.mesaId===mesaId && p.estado!=="archivado";});
  return list[0];
}
function itemsTotal(items){
  var t=0;
  (items||[]).forEach(function(it){ t+=it.subtotal||0; });
  return t;
}
function allItemsServidos(pedido){
  var items = pedido ? (pedido.items||[]) : [];
  return items.length>0 && items.every(function(it){return !!it.servido;});
}
function mesaEstado(mesaId){
  var p = activePedidoForMesa(mesaId);
  /* Un pedido sin platos (recién creado y aún no se agregó nada, o se
     quitaron todos los platos uno por uno) no cuenta como mesa ocupada:
     debe verse "Libre" igual que si nunca se hubiera entrado a la mesa. */
  if(!p || !p.items || p.items.length===0) return "libre";
  if(allItemsServidos(p)) return "atendida";
  return p.estado==="cerrado" ? "cerrado" : "abierto";
}

/* ============================== PENDIENTES (todas las mesas juntas) ============================== */

function pendientesAgrupados(){
  var items = [];
  var mesasConPendientes = {};
  S.pedidos.forEach(function(p){
    if(p.estado==="archivado") return;
    var mesa = getMesa(p.mesaId);
    if(!mesa) return;
    var ambiente = getAmbiente(mesa.ambienteId);
    (p.items||[]).forEach(function(it){
      if(it.servido) return;
      items.push({
        mesaId: mesa.id,
        mesaNumero: mesa.numero,
        ambienteNombre: ambiente ? ambiente.nombre : "",
        itemId: it.id,
        nombre: it.nombre,
        presentacion: it.presentacion,
        cantidad: it.cantidad,
        detalle: it.detalle,
        mozoCode: p.mozoCode||""
      });
      mesasConPendientes[mesa.id] = true;
    });
  });
  items.sort(function(a,b){
    var byMesa = String(a.mesaNumero||"").localeCompare(String(b.mesaNumero||""), undefined, {numeric:true});
    if(byMesa!==0) return byMesa;
    return (a.nombre||"").localeCompare(b.nombre||"");
  });
  var totalPlatos = 0;
  items.forEach(function(it){ totalPlatos += it.cantidad||0; });
  return {items:items, totalPlatos:totalPlatos, totalMesas:Object.keys(mesasConPendientes).length};
}

function showToast(msg){

  renderToast();
  var mine = S.toast.key;
  setTimeout(function(){
    if(S.toast && S.toast.key===mine){ S.toast=null; renderToast(); }
  }, 1900);
}

/* ============================== CRUD ============================== */

function addAmbiente(nombre){
  var ref = DB.collection("ambientes").doc();
  return ref.set({nombre:nombre, orden:nextOrden(S.ambientes)});
}
function updateAmbiente(id, patch){ return DB.collection("ambientes").doc(id).update(patch); }
function deleteAmbienteCascade(id){
  var mesas = mesasDeAmbiente(id);
  var proms = mesas.map(function(m){ return deleteMesaCascade(m.id); });
  return Promise.all(proms).then(function(){
    return DB.collection("ambientes").doc(id).delete();
  });
}
function moveAmbiente(id, dir){
  var list = ambientesOrdenadas();
  var idx = list.findIndex(function(a){return a.id===id;});
  var swapIdx = idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=list.length) return Promise.resolve();
  var a=list[idx], b=list[swapIdx];
  var oa=a.orden||0, ob=b.orden||0;
  return Promise.all([
    DB.collection("ambientes").doc(a.id).update({orden:ob}),
    DB.collection("ambientes").doc(b.id).update({orden:oa})
  ]);
}

function addMesa(ambienteId, numero){
  var ref = DB.collection("mesas").doc();
  return ref.set({ambienteId:ambienteId, numero:numero, orden:nextOrden(mesasDeAmbiente(ambienteId))});
}
function updateMesa(id, patch){ return DB.collection("mesas").doc(id).update(patch); }
function deleteMesaCascade(id){
  var peds = S.pedidos.filter(function(p){return p.mesaId===id;});
  var proms = peds.map(function(p){ return DB.collection("pedidos").doc(p.id).delete(); });
  return Promise.all(proms).then(function(){
    return DB.collection("mesas").doc(id).delete();
  });
}
function moveMesa(id, dir){
  var mesa = getMesa(id);
  if(!mesa) return Promise.resolve();
  var list = mesasDeAmbiente(mesa.ambienteId);
  var idx = list.findIndex(function(m){return m.id===id;});
  var swapIdx = idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=list.length) return Promise.resolve();
  var a=list[idx], b=list[swapIdx];
  var oa=a.orden||0, ob=b.orden||0;
  return Promise.all([
    DB.collection("mesas").doc(a.id).update({orden:ob}),
    DB.collection("mesas").doc(b.id).update({orden:oa})
  ]);
}

function addProducto(data){
  var payload = Object.assign({}, data, {orden: nextOrden(productosDeCategoria(data.categoriaId))});
  return DB.collection("productos").add(payload);
}
function updateProducto(id, patch){ return DB.collection("productos").doc(id).update(patch); }
function deleteProducto(id){ return DB.collection("productos").doc(id).delete(); }
function moveProducto(id, dir){
  var prod = getProducto(id);
  if(!prod) return Promise.resolve();
  var list = productosDeCategoria(prod.categoriaId);
  var idx = list.findIndex(function(p){return p.id===id;});
  var swapIdx = idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=list.length) return Promise.resolve();
  var a=list[idx], b=list[swapIdx];
  var oa = a.orden!=null ? a.orden : idx;
  var ob = b.orden!=null ? b.orden : swapIdx;
  return Promise.all([
    DB.collection("productos").doc(a.id).update({orden:ob}),
    DB.collection("productos").doc(b.id).update({orden:oa})
  ]);
}

function ensurePedido(mesaId){
  var existing = activePedidoForMesa(mesaId);
  if(existing) return Promise.resolve(existing);
  var mesa = getMesa(mesaId);
  if(mesa && mesa.liberadaEn){
    /* Se está volviendo a usar una mesa que estaba en su ventana de
       gracia tras liberarse: le quitamos la marca para que no la borre
       purgeMesasLiberadas() mientras ya tiene un pedido nuevo. */
    DB.collection("mesas").doc(mesaId).update({liberadaEn: null});
  }
  var ref = DB.collection("pedidos").doc();
  var data = {
    mesaId:mesaId,
    ambienteId: mesa ? mesa.ambienteId : null,
    estado:"abierto",
    items:[],
    total:0,
    mozoCode: S.mozoCode || null,
    creadoEn:new Date().toISOString(),
    actualizadoEn:new Date().toISOString()
  };
  return ref.set(data).then(function(){
    var o = {id:ref.id};
    for(var k in data) o[k]=data[k];
    return o;
  });
}

function saveItemToPedido(mesaId, item, editingItemId){
  return ensurePedido(mesaId).then(function(pedido){
    var items = (pedido.items||[]).slice();
    if(editingItemId){
      items = items.map(function(it){ return it.id===editingItemId ? item : it; });
    } else {
      items.push(item);
    }
    var total = itemsTotal(items);
    return DB.collection("pedidos").doc(pedido.id).update({items:items, total:total, actualizadoEn:new Date().toISOString()});
  });
}
function updateItemQty(mesaId, itemId, delta){
  var pedido = activePedidoForMesa(mesaId);
  if(!pedido) return;
  var items = pedido.items.map(function(it){
    if(it.id!==itemId) return it;
    var q = Math.max(1, (it.cantidad||1)+delta);
    return Object.assign({}, it, {cantidad:q, subtotal: q*it.precioUnit});
  });
  var total = itemsTotal(items);
  DB.collection("pedidos").doc(pedido.id).update({items:items, total:total, actualizadoEn:new Date().toISOString()});
}
function toggleItemServido(mesaId, itemId){
  var pedido = activePedidoForMesa(mesaId);
  if(!pedido) return;
  var items = pedido.items.map(function(it){
    if(it.id!==itemId) return it;
    return Object.assign({}, it, {servido: !it.servido});
  });
  DB.collection("pedidos").doc(pedido.id).update({items:items, actualizadoEn:new Date().toISOString()});
}
function removeItem(mesaId, itemId){
  var pedido = activePedidoForMesa(mesaId);
  if(!pedido) return;
  var items = pedido.items.filter(function(it){return it.id!==itemId;});
  var total = itemsTotal(items);
  DB.collection("pedidos").doc(pedido.id).update({items:items, total:total, actualizadoEn:new Date().toISOString()});
}
function toggleEstadoPedido(mesaId){
  var pedido = activePedidoForMesa(mesaId);
  if(!pedido) return;
  var nuevo = pedido.estado==="cerrado" ? "abierto" : "cerrado";
  DB.collection("pedidos").doc(pedido.id).update({estado:nuevo, actualizadoEn:new Date().toISOString()});
}
function liberarMesa(mesaId){
  var pedido = activePedidoForMesa(mesaId);
  var now = new Date().toISOString();
  var prom = pedido
    ? DB.collection("pedidos").doc(pedido.id).update({estado:"archivado", archivadoEn:now, actualizadoEn:now})
    : Promise.resolve();
  /* La mesa no se borra al toque: queda marcada como liberada (sigue
     viéndose como "Libre" con normalidad) y recién se elimina sola
     pasados MESA_LIBERADA_MS, para dar un tiempo prudente antes de que
     desaparezca. Si se vuelve a usar antes de ese tiempo, se le quita
     la marca (ver ensurePedido) y sigue existiendo normalmente. */
  return prom.then(function(){ return DB.collection("mesas").doc(mesaId).update({liberadaEn: now}); });
}

var MESA_LIBERADA_MS = 5*60*1000; /* 5 minutos */

function purgeMesasLiberadas(){
  if(!DB) return;
  var now = Date.now();
  S.mesas.forEach(function(m){
    if(!m.liberadaEn) return;
    var t = new Date(m.liberadaEn).getTime();
    if(!t || (now-t) <= MESA_LIBERADA_MS) return;
    if(activePedidoForMesa(m.id)) return; /* se volvió a usar: no borrar */
    DB.collection("mesas").doc(m.id).delete();
  });
}

/* ============================== HISTORIAL (mesas atendidas) ============================== */

var HISTORIAL_MS = 8*60*60*1000; /* 8 horas */

function historialOrdenado(){
  return S.pedidos.filter(function(p){return p.estado==="archivado";})
    .slice()
    .sort(function(a,b){
      var ta = new Date(a.archivadoEn||a.actualizadoEn||0).getTime();
      var tb = new Date(b.archivadoEn||b.actualizadoEn||0).getTime();
      return tb-ta;
    });
}
function purgeHistorialViejo(){
  if(!DB) return;
  var now = Date.now();
  S.pedidos.forEach(function(p){
    if(p.estado!=="archivado") return;
    var t = new Date(p.archivadoEn||p.actualizadoEn||0).getTime();
    if(!t || (now-t) > HISTORIAL_MS){
      DB.collection("pedidos").doc(p.id).delete();
    }
  });
}
function formatFechaHora(iso){
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleString("es-PE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  }catch(e){ return ""; }
}

function renderShell(opts){
  var html = "";
  html += '<div class="appbar">';
  if(opts.back){
    html += '<button class="iconbtn" data-action="back" aria-label="Volver">&#8592;</button>';
  }
  html += '<div class="titles"><h1>'+escapeHtml(opts.title)+'</h1>';

var PLAN_SCALE = 0.95;
function renderMesasPlano(ambiente, mesas){
  var planW = ambiente.planW || 100, planH = ambiente.planH || 40;
  var conPos = mesas.filter(function(m){ return typeof m.posX==="number" && typeof m.posY==="number"; });
  var sinPos = mesas.filter(function(m){ return !(typeof m.posX==="number" && typeof m.posY==="number"); });
  var html = "";
  if(conPos.length>0){
    var pad = 12, k = PLAN_SCALE;
    var minX = Math.min.apply(null, conPos.map(function(m){return m.posX;})) - planW/2 - pad;
    var maxX = Math.max.apply(null, conPos.map(function(m){return m.posX;})) + planW/2 + pad;
    var minY = Math.min.apply(null, conPos.map(function(m){return m.posY;})) - planH/2 - pad;
    var maxY = Math.max.apply(null, conPos.map(function(m){return m.posY;})) + planH/2 + pad;
    var totalW = (maxX-minX)*k, totalH = (maxY-minY)*k;
    html += '<div class="planwrap"><div class="plan" style="width:'+totalW+'px;height:'+totalH+'px;">';
    conPos.forEach(function(m){
      var est = mesaEstado(m.id);
      var left = (m.posX - planW/2 - minX)*k, top = (m.posY - planH/2 - minY)*k;
      var w = planW*k, h = planH*k;
      html += '<div class="plantile '+est+'" data-action="'+(S.organize?"noop":"open-mesa")+'" data-id="'+m.id+'" '+
        'style="left:'+left+'px;top:'+top+'px;width:'+w+'px;height:'+h+'px;">'+
        '<div class="num">'+escapeHtml(m.numero)+'</div></div>';
    });
    html += '</div></div>';
    html += '<div class="planlegend">'+
      '<span><i class="sw" style="background:var(--success-bg);border-color:var(--success);"></i>Libre</span>'+
      '<span><i class="sw" style="background:#FCE7DC;border-color:var(--accent);"></i>Ocupada</span>'+
      '<span><i class="sw" style="background:var(--warning-bg);border-color:var(--warning);"></i>Cerrada</span>'+
      '<span><i class="sw" style="background:var(--success-bg);border-color:var(--teal);"></i>Atendida</span></div>';
  }
  if(sinPos.length>0){
    html += '<div class="section-title" style="margin-top:16px;">Otras mesas</div><div class="grid">';
    sinPos.forEach(function(m){
      var est = mesaEstado(m.id);
      var dotColor = est==="libre"?"var(--success)":est==="cerrado"?"var(--warning)":est==="atendida"?"var(--teal)":"var(--accent)";
      html += '<div class="tile '+est+'" data-action="'+(S.organize?"noop":"open-mesa")+'" data-id="'+m.id+'">'+
        '<span class="status-dot" style="background:'+dotColor+'"></span>'+
        '<div class="num">'+escapeHtml(m.numero)+'</div></div>';
    });
    html += '</div>';
  }
  return html;
}

function renderMesaScreen(params){
  var mesa = getMesa(params.mesaId);
  if(!mesa){
    goHome();
    return "";
  }
  var ambiente = getAmbiente(mesa.ambienteId);
  var pedido = activePedidoForMesa(mesa.id);
  var est = mesaEstado(mesa.id);

  var body = "";
  if(!pedido || (pedido.items||[]).length===0){
    body += '<div class="empty"><div class="icon">&#127860;</div><h3>Mesa '+escapeHtml(mesa.numero)+' libre</h3>'+
      '<p>Toma el pedido de esta mesa.</p>'+
      '<button class="btn primary" data-action="go-categorias" data-mesa-id="'+mesa.id+'">Realizar pedido</button></div>';
  } else {
    var estPillTxt = est==="atendida" ? "&#10003; Mesa atendida &mdash; todo servido" : (est==="cerrado"?"Pedido cerrado":"Pedido abierto");
    body += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'+
      '<span class="status-pill '+est+'"><span class="dot"></span>'+estPillTxt+'</span>'+
      '</div>';
    var servidosN = pedido.items.filter(function(it){return it.servido;}).length;
    body += '<div class="servedcount'+(est==="atendida"?" complete":"")+'">'+servidosN+' de '+pedido.items.length+' platos servidos</div>';
    body += '<button class="btn primary block" data-action="go-categorias" data-mesa-id="'+mesa.id+'" style="margin:12px 0 16px;">Agregar productos</button>';
    var itemsOrdenados = pedido.items.slice().sort(function(a,b){
      var byName = (a.nombre||"").localeCompare(b.nombre||"");
      if(byName!==0) return byName;
      var byPres = (a.presentacion||"").localeCompare(b.presentacion||"");
      if(byPres!==0) return byPres;
      return (a.detalle||"").localeCompare(b.detalle||"");
    });
    itemsOrdenados.forEach(function(it){
      body += '<div class="itemcard'+(it.servido?" served":"")+'">'+
        '<div class="row1"><div class="name">'+it.cantidad+' &times; '+escapeHtml(it.nombre)+(it.presentacion==="Fuente"?" (Fuente)":"")+'</div>'+
        '<div class="price">'+money(it.subtotal)+'</div></div>';
      if(it.detalle) body += '<div class="detalle">'+escapeHtml(it.detalle)+'</div>';
      body += '<div style="margin-top:9px;"><button class="servedpill '+(it.servido?"done":"pending")+'" data-action="toggle-item-servido" data-mesa-id="'+mesa.id+'" data-item-id="'+it.id+'">'+
        (it.servido?"&#10003; Servido":"Pendiente &middot; marcar servido")+'</button></div>';
      body += '<div class="row2">'+
        '<div class="qtystepper">'+
          '<button data-action="qty-item" data-mesa-id="'+mesa.id+'" data-item-id="'+it.id+'" data-delta="-1">&minus;</button>'+
          '<span class="n">'+it.cantidad+'</span>'+
          '<button data-action="qty-item" data-mesa-id="'+mesa.id+'" data-item-id="'+it.id+'" data-delta="1">+</button>'+
        '</div>'+
        '<div style="display:flex;gap:8px;align-items:center;">'+
          '<button class="edit-link" data-action="edit-item" data-mesa-id="'+mesa.id+'" data-item-id="'+it.id+'">Editar</button>'+
          '<button class="iconbtn small" data-action="delete-item" data-mesa-id="'+mesa.id+'" data-item-id="'+it.id+'" title="Quitar">&#10005;</button>'+
        '</div>'+
      '</div></div>';
    });
  }

  var html = renderShell({
    back:true,
    title:"Mesa "+mesa.numero,
    sub: ambiente ? ambiente.nombre : "",
    body: body
  });

  if(pedido && (pedido.items||[]).length>0){
    html += '<div class="totalbar"><div class="totalbar-inner">'+
      '<div class="toprow"><span class="tot-label">Total</span><span class="tot-value">'+money(itemsTotal(pedido.items))+'</span></div>'+
      '<div class="btnrow">'+
        '<button class="btn secondary" data-action="toggle-estado-pedido" data-mesa-id="'+mesa.id+'">'+(pedido.estado==="cerrado"?"Reabrir":"Cerrar pedido")+'</button>'+
        '<button class="btn secondary" data-action="liberar-mesa" data-mesa-id="'+mesa.id+'">Liberar mesa</button>'+
      '</div></div></div>';
  }
  return html;
}

/* ============================== MAIN RENDER ============================== */

function render(){
  var app = document.getElementById("app");
  /* Como se reconstruye todo el HTML en cada render, si hay un campo de
     texto enfocado (ej. la búsqueda mientras se escribe) guardamos el foco
     y la posición del cursor para restaurarlos después, así no se pierde
     con cada letra que se escribe. */
  var focusInfo = null;
  var activeEl = document.activeElement;
  if(activeEl && app && app.contains(activeEl) && activeEl.id){
    focusInfo = {
      id: activeEl.id,
      selStart: (typeof activeEl.selectionStart==="number") ? activeEl.selectionStart : null,
      selEnd: (typeof activeEl.selectionEnd==="number") ? activeEl.selectionEnd : null
    };
  }
  var scr = current();
  var html = "";
  if(!S.mozoCode) html = renderMozoGate();
  else if(!S.selectedAmbienteId || !getAmbiente(S.selectedAmbienteId)) html = renderAmbienteGate();
  else if(scr.screen==="home") html = renderHome();
  else if(scr.screen==="mesa") html = renderMesaScreen(scr.params);
  else if(scr.screen==="categorias") html = renderCategoriasScreen(scr.params);
  else if(scr.screen==="texto-pedido") html = renderTextoPedidoScreen(scr.params);
  else if(scr.screen==="productos") html = renderProductosScreen(scr.params);
  else if(scr.screen==="carta") html = renderCartaAdmin();
  else if(scr.screen==="historial") html = renderHistorialScreen();
  else if(scr.screen==="pendientes") html = renderPendientesScreen();
  else if(scr.screen==="admin-gate") html = renderAdminGate();
  else if(scr.screen==="admin-home") html = renderAdminHomeScreen();
  else if(scr.screen==="admin-pendientes") html = renderAdminPendientesScreen();
  else html = renderHome();
  app.innerHTML = html;
  if(focusInfo){
    var again = document.getElementById(focusInfo.id);
    if(again){
      again.focus();
      if(focusInfo.selStart!=null && again.setSelectionRange){
        try{ again.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
    }
  }
  renderModal();
  renderToast();
}

/* ============================== MODALS ============================== */

function openModal(type, data){ S.modal = Object.assign({type:type}, data||{}); renderModal(); }
function closeModal(){ S.modal=null; renderModal(); }
function openConfirm(opts){ S.confirm = opts; renderModal(); }
function closeConfirm(){ S.confirm=null; renderModal(); }

function renderModal(){
  var layer = document.getElementById("modal-layer");
  var html = "";
  if(S.modal){
    html += renderModalContent(S.modal);
  }
  if(S.confirm){
    html += '<div class="overlay center" data-action="confirm-backdrop"><div class="dialog">'+
      '<h3>'+escapeHtml(S.confirm.title)+'</h3>'+
      '<p>'+escapeHtml(S.confirm.message)+'</p>'+
      '<div class="btnrow">'+
        '<button class="btn secondary" data-action="confirm-no">Cancelar</button>'+
        '<button class="btn '+(S.confirm.danger?"danger":"primary")+'" data-action="confirm-yes">'+escapeHtml(S.confirm.confirmLabel||"Confirmar")+'</button>'+
      '</div></div></div>';
  }
  layer.innerHTML = html;
}

function renderModalContent(m){
  if(m.type==="ambiente-form") return renderAmbienteForm(m);
  if(m.type==="mesa-form") return renderMesaForm(m);
  if(m.type==="producto-form") return renderProductoForm(m);
  if(m.type==="producto-config") return renderProductoConfig(m);
  return "";
}

function sheetWrap(headerHtml, bodyHtml, footerHtml){
  return '<div class="overlay" data-action="overlay-backdrop"><div class="sheet" data-stop="1">'+
    '<div class="sheet-handle"></div>'+
    headerHtml+
    '<div class="sheet-body">'+bodyHtml+'</div>'+
    (footerHtml ? '<div class="sheet-footer">'+footerHtml+'</div>' : '')+
    '</div></div>';
}

/* ---- producto config (agregar/editar item de pedido) ---- */
function renderProductoConfig(m){
  var producto = getProducto(m.productoId);
  if(!producto) return "";
  var draft = m.draft;
  var precioUnit = (draft.presentacion==="Fuente" && producto.precioFuente) ? producto.precioFuente : producto.precioPersonal;
  var subtotal = precioUnit * draft.cantidad;

  var header = '<div class="sheet-header"><div><h2>'+escapeHtml(producto.nombre)+'</h2>'+
    (producto.descripcion ? '<div class="desc">'+escapeHtml(producto.descripcion)+'</div>' : '')+
    '</div><button class="iconbtn" style="background:var(--surface-2);color:var(--text);" data-action="close-modal">&#10005;</button></div>';

  var body = "";
  body += '<div class="pref-group"><div class="glabel">Cantidad</div><div class="stepper-lg">'+
    '<button data-action="modal-qty" data-delta="-1">&minus;</button>'+
    '<span class="n">'+draft.cantidad+'</span>'+
    '<button data-action="modal-qty" data-delta="1">+</button>'+
    '</div></div>';

  if(producto.precioFuente){
    body += '<div class="pref-group"><div class="glabel">Presentación</div><div class="chipselect">'+
      '<div class="optchip'+(draft.presentacion==="Personal"?" sel":"")+'" data-action="modal-select-presentacion" data-value="Personal">Personal &middot; '+money(producto.precioPersonal)+'</div>'+
      '<div class="optchip'+(draft.presentacion==="Fuente"?" sel":"")+'" data-action="modal-select-presentacion" data-value="Fuente">Fuente &middot; '+money(producto.precioFuente)+'</div>'+
      '</div></div>';
  }

  (producto.preferencias||[]).forEach(function(g){
    body += '<div class="pref-group"><div class="glabel">'+escapeHtml(g.nombre)+'</div><div class="chipselect">';
    (g.opciones||[]).forEach(function(op){
      var sel = g.tipo==="multi" ? (draft.prefs[g.id]||[]).indexOf(op)>=0 : draft.prefs[g.id]===op;
      body += '<div class="optchip'+(sel?" sel":"")+'" data-action="modal-select-pref" data-group-id="'+g.id+'" data-value="'+escapeHtml(op)+'" data-multi="'+(g.tipo==="multi"?"1":"0")+'">'+escapeHtml(op)+'</div>';
    });
    body += '</div></div>';
  });

  var obsList = (producto.observacionesSugeridas && producto.observacionesSugeridas.length) ? producto.observacionesSugeridas : OBS_GENERICAS;
  body += '<div class="pref-group"><div class="glabel">Observaciones</div><div class="chipselect">';
  obsList.forEach(function(op){
    var sel = (draft.obsChips||[]).indexOf(op)>=0;
    body += '<div class="optchip obs'+(sel?" sel":"")+'" data-action="modal-toggle-obs-chip" data-value="'+escapeHtml(op)+'">'+escapeHtml(op)+'</div>';
  });
  body += '</div></div>';

  body += '<div class="field"><label>Otras observaciones</label>'+
    '<textarea id="f-modal-obs-texto" data-bind="obsTexto" placeholder="Escribe una indicación adicional&hellip;">'+escapeHtml(draft.obsTexto||"")+'</textarea></div>';

  var footer = "";
  if(m.editingItemId){
    footer += '<button class="btn danger" data-action="modal-delete-item">Quitar</button>';
  }
  footer += '<button class="btn primary" data-action="modal-save">'+(m.editingItemId?"Guardar cambios":"Agregar al pedido")+' &middot; '+money(subtotal)+'</button>';

  return sheetWrap(header, body, footer);
}

/* ============================== TOAST ============================== */
function renderToast(){
  var layer = document.getElementById("toast-layer");
  layer.innerHTML = S.toast ? '<div class="toast">'+escapeHtml(S.toast.msg)+'</div>' : "";
}

/* ============================== BUILD DETALLE ============================== */

function buildDetalle(producto, draft){
  var parts = [];
  (producto.preferencias||[]).forEach(function(g){
    var val = draft.prefs[g.id];
    if(g.tipo==="multi"){
      if(val && val.length) parts.push(val.join(", "));
    } else {
      if(val && g.opciones && val !== g.opciones[0]) parts.push(val);
    }
  });
  if(draft.obsChips && draft.obsChips.length) parts.push(draft.obsChips.join(", "));
  if(draft.obsTexto && draft.obsTexto.trim()) parts.push(draft.obsTexto.trim());
  return parts.join(" · ");
}

function defaultPrefs(producto){
  var prefs = {};
  (producto.preferencias||[]).forEach(function(g){
    if(g.tipo==="multi") prefs[g.id]=[];
    else prefs[g.id] = (g.opciones && g.opciones[0]) || "";
  });
  return prefs;
}

        obsTexto: draft2.obsTexto,
        detalle: buildDetalle(producto2, draft2),
        servido: prevServido
      };
      saveItemToPedido(mp.mesaId, item, mp.editingItemId).then(function(){
        showToast(mp.editingItemId ? "Producto actualizado" : "Agregado al pedido");
      });
      if(!mp.editingItemId){
        /* Solo cuenta como "pedido" cuando se agrega de nuevo al pedido,
           no cuando se edita uno ya agregado, así el orden por
           popularidad refleja cuántas veces se pidió realmente. */
        DB.collection("productos").doc(producto2.id).update({vecesPedido: (producto2.vecesPedido||0) + (item.cantidad||1)});
      }
      closeModal();
      return;
    }
    case "modal-delete-item": {
      if(!S.modal) return;
      var mp2 = S.modal;
      closeModal();
      removeItem(mp2.mesaId, mp2.editingItemId);
      showToast("Producto quitado");
      return;
    }
  }
});

function readProductoFormIntoDraft(d){
  var catEl = document.getElementById("f-prod-categoria");
  if(catEl) d.categoriaId = catEl.value;
  document.querySelectorAll('[data-bind="nombre"]').forEach(function(elx){ d.nombre = elx.value; });
  document.querySelectorAll('[data-bind="descripcion"]').forEach(function(elx){ d.descripcion = elx.value; });
  document.querySelectorAll('[data-bind="precioPersonal"]').forEach(function(elx){ d.precioPersonal = elx.value; });
  document.querySelectorAll('[data-bind="precioFuente"]').forEach(function(elx){ d.precioFuente = elx.value; });
  document.querySelectorAll('[data-bind="observacionesSugeridas"]').forEach(function(elx){
    d.observacionesSugeridas = elx.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
  });
  document.querySelectorAll('[data-bind="pref-nombre"]').forEach(function(elx){
    var i = parseInt(elx.getAttribute("data-index"),10);
    if(d.preferencias[i]) d.preferencias[i].nombre = elx.value;
  });
  document.querySelectorAll('[data-bind="pref-tipo"]').forEach(function(elx){
    var i = parseInt(elx.getAttribute("data-index"),10);
    if(d.preferencias[i]) d.preferencias[i].tipo = elx.value;
  });
  document.querySelectorAll('[data-bind="pref-opciones"]').forEach(function(elx){
    var i = parseInt(elx.getAttribute("data-index"),10);
    if(d.preferencias[i]) d.preferencias[i].opciones = elx.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
  });
}

/* Keep form fields synced into the modal draft on every keystroke/change, WITHOUT forcing a
   re-render — this preserves focus/caret and also prevents values from being lost whenever a
   button click (checkbox toggle, add/remove preference row, quantity, chip selection) later
   triggers renderModal(), which rebuilds the sheet's HTML from the draft object. */
function syncFieldToDraft(t){
  if(!S.modal || !t || !t.getAttribute) return;
  var bind = t.getAttribute("data-bind");
  if(!bind) return;
  var d = S.modal.draft;
  if(!d) return;
  if(bind==="obsTexto"){ d.obsTexto = t.value; return; }
  if(bind==="categoriaId"){ d.categoriaId = t.value; return; }
  if(bind==="nombre"){ d.nombre = t.value; return; }
  if(bind==="descripcion"){ d.descripcion = t.value; return; }
  if(bind==="precioPersonal"){ d.precioPersonal = t.value; return; }
  if(bind==="precioFuente"){ d.precioFuente = t.value; return; }
  if(bind==="observacionesSugeridas"){
    d.observacionesSugeridas = t.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    return;
  }
  var idxAttr = t.getAttribute("data-index");
  if(idxAttr!==null && d.preferencias){
    var i = parseInt(idxAttr,10);
    if(!d.preferencias[i]) return;
    if(bind==="pref-nombre") d.preferencias[i].nombre = t.value;
    else if(bind==="pref-tipo") d.preferencias[i].tipo = t.value;
    else if(bind==="pref-opciones") d.preferencias[i].opciones = t.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
  }
}
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(t && t.getAttribute && t.getAttribute("data-bind")==="buscar-producto"){
    S.busquedaProducto = t.value;
    render();
    return;
  }
  syncFieldToDraft(t);
});
document.addEventListener("change", function(ev){ syncFieldToDraft(ev.target); });

initTema();
initMozoCode();
initAdminOk();
initAmbienteTrabajo();
initStore();
render();

})();
